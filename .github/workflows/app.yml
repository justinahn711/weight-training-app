name: App

# Separate from the test workflow because it needs a matching Xcode, and that
# pins it to a specific runner image: macos-15 ships Xcode 16.4, where TrendsView
# fails to compile because Swift Charts lacks the result builder it uses. The
# domain suite has no such constraint, so keeping them apart means a runner image
# lagging reads as "the app needs a newer Xcode" rather than "the domain broke".
#
# CI is a pre-merge gate. Running the merge commit again on main only repeats the
# same expensive macOS build, while workflow_dispatch keeps an escape hatch for
# validating a direct push. Drafts are checked locally and get one CI run when
# they become ready for review instead of one run per work-in-progress push.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Unfiltered for the same reason as tests.yml: this job's name is a
    # required status check, and a required check that is filtered out never
    # reports, which blocks the PR permanently rather than passing it. A
    # hooks-only or docs-only PR hit exactly that.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for simulator
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # Xcode 26.6 — the app target needs it (see above).
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      # No signing: a simulator build doesn't need it, and CI has no
      # certificates. Device signing is verified locally, where the entitlements
      # can be checked against a real profile.
      #
      # This is a compile check ONLY — it proves the source builds and nothing
      # more. Stripping signing also strips entitlements, so the binary this
      # produces cannot launch (#155: NSPersistentCloudKitContainer aborts with
      # "containerIdentifier can not be nil" before the first frame). The
      # `ui-test` job below is what actually proves the app starts; keep this
      # one fast and let that one carry the launch guarantee.
      - name: Build app and widget
        run: |
          xcodebuild \
            -project ChickenBreast/ChickenBreast.xcodeproj \
            -scheme ChickenBreast \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-test:
    name: App unit tests
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # Same image as `build` and `ui-test` (see the top-of-file comment).
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      # Not a required check by design (#181): a brand-new job name is never
      # one of the two exact names branch protection looks for
      # (`swift test`, `Build for simulator`), and it must not become a third
      # — a required check that gains a `paths:` filter, or that quietly stops
      # reporting, is exactly how #159 wedged every PR in the repo. This job
      # is purely additive: it reports on every PR and can fail loudly without
      # being able to block a merge on its own.
      #
      # ChickenBreastTests is hosted by the ChickenBreast app target (its
      # TEST_HOST), so it still needs a real simulator rather than running as
      # a plain `swift test` — but unlike `ui-test` below, nothing in it
      # drives the UI, so it stays fast. Deliberately no
      # CODE_SIGNING_ALLOWED=NO, for the same reason as `ui-test`: that flag
      # strips the Simulated-entitlements section and the hosting app aborts
      # at launch with the #155/#160 CKException before a single test runs.
      - name: Choose a simulator the runner actually has
        id: sim
        run: |
          name=$(xcrun simctl list devices available \
                 | sed -nE 's/^[[:space:]]*(iPhone [^(]*[^([:space:]])[[:space:]]*\(.*/\1/p' \
                 | head -1)
          if [ -z "$name" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $name"

      - name: Run ChickenBreastTests
        run: |
          xcodebuild test \
            -project ChickenBreast/ChickenBreast.xcodeproj \
            -scheme ChickenBreast \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:ChickenBreastTests \
            -resultBundlePath UnitTestResults.xcresult

      - name: Upload unit test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: UnitTestResults.xcresult

  ui-test:
    name: UI launch test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # Same image as `build` (see the top-of-file comment) — this also builds
    # the app target, and it runs the actual simulator, so it needs a matching
    # simulator runtime too.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      # Deliberately does NOT pass CODE_SIGNING_ALLOWED=NO (#155).
      #
      # A plain `xcodebuild test` for a Simulator destination signs ad hoc
      # ("Sign to Run Locally") with no certificate and no Apple ID — that part
      # was never the problem. Alongside it, Xcode also writes a separate
      # "Simulated" entitlements section into the binary containing the real
      # capability list (iCloud, HealthKit) from ChickenBreast.entitlements.
      # That mechanism exists specifically so capability-gated frameworks work
      # on Simulator without a developer account, and it is NOT produced when
      # code signing is turned off outright — which is exactly what rung 4
      # above does, and why it builds a binary that cannot launch.
      #
      # Verified locally before writing this: `build` (as above, with
      # CODE_SIGNING_ALLOWED=NO) installs and crashes with the CKException in
      # the issue on first launch; a completely default `xcodebuild build` —
      # no signing flags touched at all — installs and reaches
      # "App did become active" every time. So the fix is exactly not passing
      # that flag here, not a certificate or a provisioning profile.
      #
      # This also means CI never needs a real signing secret for this check,
      # which is worth keeping true: a certificate in Actions is manageable,
      # but it is one more secret to rotate and scope for a problem the
      # Simulated-entitlements mechanism already solves for free.
      #
      # ChickenBreastUITests (#114) is the actual launch check: it installs
      # the app and taps through it, so a crash on launch fails a test and
      # names launching as the thing that broke, instead of a build step
      # quietly reporting green over a binary nobody ran.
      # Picks whatever iPhone the runner image actually ships rather than
      # naming one. `name=iPhone 17 Pro` was hardcoded when this job was
      # written, and it failed in 92 seconds with "Unable to find a device
      # matching the provided destination specifier" as soon as the image
      # moved on — a red check that says nothing about the code, which is the
      # kind that teaches people to stop reading checks.
      #
      # Takes the first available iPhone, not the "best" one — any of them
      # proves the app launches, which is all this job claims to check. An
      # earlier draft of this step said it picked the newest by taking the
      # last match; that was wrong twice over, since simctl's order is not
      # version order and every match carries a trailing space that would
      # have gone straight into the destination string.
      - name: Choose a simulator the runner actually has
        id: sim
        run: |
          name=$(xcrun simctl list devices available \
                 | sed -nE 's/^[[:space:]]*(iPhone [^(]*[^([:space:]])[[:space:]]*\(.*/\1/p' \
                 | head -1)
          if [ -z "$name" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $name"

      # -only-testing scopes this to the UI suite specifically (#181): the
      # scheme's TestAction now also lists ChickenBreastTests, run separately
      # and faster by the `unit-test` job above. Without this flag the two
      # jobs would silently duplicate each other's work on every PR.
      - name: Build and run UI tests (installs and launches the real app)
        run: |
          xcodebuild test \
            -project ChickenBreast/ChickenBreast.xcodeproj \
            -scheme ChickenBreast \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -only-testing:ChickenBreastUITests \
            -resultBundlePath UITestResults.xcresult

      # Not a required check (see PR #155): a UI test suite that boots a
      # simulator is slower and more failure-prone than the domain suite, and
      # branch protection already has swift test + Build for simulator. This
      # runs on every PR and reports, but a flake here should not be able to
      # block every merge in the repo the way a required check's flake would.
      - name: Upload UI test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: UITestResults.xcresult
