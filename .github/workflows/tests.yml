name: Tests

# The package needs macOS for SwiftData but has no simulator dependency. Keep it
# separate from app.yml so a runner-image/Xcode failure reads as an app failure.
# CI is a pre-merge gate: drafts are verified locally, then run here once they
# become ready. workflow_dispatch remains available for exceptional direct
# pushes without paying to repeat every successfully merged PR on main.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    # Deliberately unfiltered. These paths used to be narrowed to skip the 10x
    # macOS multiplier on a private repo's 2000-minute allowance — which the
    # repo going public removed entirely.
    #
    # Keeping the filter after that had a cost nobody had priced: `swift test`
    # is a required status check, and a required check that never runs never
    # reports, so branch protection blocks the PR forever. Every app-only PR
    # was permanently unmergeable. A filter that decides whether a *required*
    # gate exists is not an optimisation, it is a trap.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer PR update supersedes an in-flight run for that PR.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: swift test
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    # macOS because SwiftData sets the floor at macOS 14, and the Store target
    # needs it.
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Guards the invariant that makes the suite fast and the domain portable:
      # Core must not acquire a dependency on SwiftData, SwiftUI or HealthKit.
      # A single import would move the reasoning behind a simulator boot.
      #
      # Shares one script with hooks/pre-push. The rule used to be written out
      # in both places and they drifted — the hook was tightened and this was
      # not, while every agent brief points at *this* step as rung 3, so the
      # documented check was the weaker one.
      - name: Core stays pure
        run: |
          if ! out=$(sh hooks/check-core-purity.sh 2>&1); then
            echo "$out"
            echo "::error::WeightTrainingCore must import Foundation only"
            exit 1
          fi
          echo "Core imports Foundation only."

      - name: Show toolchain
        run: swift --version

      # swift test builds the test products before running them. A separate
      # swift build --build-tests duplicated the build graph on every runner.
      - name: Test
        run: swift test
