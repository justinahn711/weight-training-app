name: Tests

# The package is pure Swift with no simulator dependency, which is the whole
# point of keeping Core and Store free of UIKit — the suite runs anywhere a
# Swift toolchain does, in a second and a half.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push supersedes an in-flight run on the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: swift test
    # macOS because SwiftData sets the floor at macOS 14, and the Store target
    # needs it.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      # Guards the invariant that makes the suite fast and the domain portable:
      # Core must not acquire a dependency on SwiftData, SwiftUI or HealthKit.
      # A single import would move the reasoning behind a simulator boot.
      #
      # Shares one script with hooks/pre-push. The rule used to be written out
      # in both places and they drifted — the hook was tightened and this was
      # not, while every agent brief points at *this* step as rung 3, so the
      # documented check was the weaker one.
      - name: Core stays pure
        run: |
          if ! out=$(sh hooks/check-core-purity.sh 2>&1); then
            echo "$out"
            echo "::error::WeightTrainingCore must import Foundation only"
            exit 1
          fi
          echo "Core imports Foundation only."
